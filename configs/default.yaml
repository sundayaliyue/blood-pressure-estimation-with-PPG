# PCTN default config (paper: Tian et al., Biomed. Signal Process. Control 99, 2025)

data:
  segment_length: 875
  num_workers: 4
  batch_size: 64
  h5_path: data/processed/MIMIC-III_ppg_dataset.h5
  split_dir: data/splits

model:
  stem:
    in_channels: 1
    out_channels: 64
    kernel_size: 15
    stride: 2
    padding: 7
  cnn:
    layers: [3, 4, 6, 3]  # ResNet-50 bottleneck counts per stage
    channels: [64, 128, 256, 512]
  transformer:
    in_channels: 64
    num_layers: 6
    num_heads: 4
    mlp_ratio: 4
    dropout: 0.1
  regressor:
    hidden_dim: 128
    output_dim: 2  # [SBP, DBP]

training:
  batch_size: 64
  epochs: 100
  lr: 0.001
  weight_decay: 0.0
  seed: 42
  device: cuda
  checkpoint_dir: outputs/checkpoints
  log_interval: 50

evaluation:
  # AAMI: ME <= 5, STD <= 8
  aami_me_threshold: 5.0
  aami_std_threshold: 8.0
