# PCTN default config (paper: Tian et al., Biomed. Signal Process. Control 99, 2025)

data:
  segment_length: 875
  sample_rate: 125
  bandpass_low: 0.5
  bandpass_high: 10.0
  train_ratio: 0.65
  val_ratio: 0.10
  test_ratio: 0.25
  num_workers: 4
  batch_size: 64
  h5_path: /home/zhanglanli1/code/learning/projects/data_preprocessing/ppg_rawdata/MIMIC-III_ppg_dataset.h5
  split_dir: /home/zhanglanli1/code/learning/projects/data_preprocessing/splits

model:
  stem:
    in_channels: 1
    out_channels: 64
    kernel_size: 15
    stride: 2
    padding: 7
  cnn:
    layers: [3, 4, 6, 3]  # ResNet-50 bottleneck counts per stage
    channels: [64, 128, 256, 512]
  transformer:
    in_channels: 64
    num_layers: 6
    num_heads: 4
    mlp_ratio: 4
    dropout: 0.1
  regressor:
    hidden_dim: 128
    output_dim: 2  # [SBP, DBP]

training:
  batch_size: 64
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0
  seed: 42
  device: cuda
  checkpoint_dir: checkpoints
  log_interval: 50

evaluation:
  # AAMI: ME <= 5, STD <= 8
  aami_me_threshold: 5.0
  aami_std_threshold: 8.0
